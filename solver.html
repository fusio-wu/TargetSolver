<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Sum and Tip/Tax Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-100 to-purple-100 flex justify-center items-start min-h-screen py-10">
    <div class="w-full max-w-2xl">
        <h1 class="text-2xl font-semibold text-blue-600 text-center mb-6">N-Sum and Tip/Tax Calculator</h1>

        <div class="flex flex-col md:flex-row gap-6">
            <section class="bg-white rounded-lg shadow-xl p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">N-Sum Solver</h2>
                <div class="mb-4">
                    <label for="target" class="block text-gray-700 text-sm font-bold mb-2">Target Sum:</label>
                    <input type="number" id="target" name="target" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-6">
                    <label for="numbers" class="block text-gray-700 text-sm font-bold mb-2">List of Numbers (comma-separated or one per line):</label>
                    <textarea id="numbers" name="numbers" rows="5" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
                </div>
                <button onclick="findSum()" class="bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full mb-4">Find Subset</button>
                <div id="result" class="mt-2 p-4 bg-gray-50 rounded-md border border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">Result:</h3>
                    <div id="loading" class="hidden">
                        <div class="flex items-center space-x-2">
                            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-500"></div>
                            <span class="text-gray-600">Calculating...</span>
                        </div>
                    </div>
                    <p id="subset" class="text-gray-700"></p>
                </div>
            </section>

            <section class="bg-white rounded-lg shadow-xl p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Tip/Tax Calculator</h2>
                <div class="mb-4">
                    <label for="totalAmount" class="block text-gray-700 text-sm font-bold mb-2">Total Amount:</label>
                    <input type="number" id="totalAmount" name="totalAmount" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="tipPercentage" class="block text-gray-700 text-sm font-bold mb-2">Tip Percentage (%):</label>
                    <input type="number" id="tipPercentage" name="tipPercentage" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-6">
                    <label for="taxPercentage" class="block text-gray-700 text-sm font-bold mb-2">Tax Percentage (%):</label>
                    <input type="number" id="taxPercentage" name="taxPercentage" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <button onclick="calculateOriginalAmount()" class="bg-gradient-to-r from-purple-400 to-pink-500 hover:from-purple-500 hover:to-pink-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">Calculate Original Amount</button>
                <div id="originalAmountResult" class="mt-2 p-4 bg-gray-50 rounded-md border border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">Original Amount:</h3>
                    <p id="originalAmount" class="text-gray-700"></p>
                </div>
            </section>
        </div>
    </div>

    <script>
        function findSum() {
            const target = parseFloat(document.getElementById("target").value);
            const numbersText = document.getElementById("numbers").value;
            const numbers = numbersText.split(/[\s,]+/).map(num => parseFloat(num.trim())).filter(num => !isNaN(num));
            const subsetDisplay = document.getElementById("subset");
            const loadingElement = document.getElementById("loading");

            if (numbers.length === 0) {
                subsetDisplay.textContent = "Please enter a list of numbers.";
                return;
            }

            // Show loading state
            loadingElement.classList.remove("hidden");
            subsetDisplay.textContent = "";

            // Use setTimeout to allow the UI to update before heavy computation
            setTimeout(() => {
                const startTime = performance.now();
                
                function findSubsetThatSumsToTarget(nums, target) {
                    const scale = 100;
                    const scaledNums = nums.map(n => Math.round(n * scale));
                    const scaledTarget = Math.round(target * scale);

                    const possibleSums = new Map(); // sum => path (list of numbers)
                    possibleSums.set(0, []);

                    for (const num of scaledNums) {
                        const newEntries = new Map();

                        for (const [sum, path] of possibleSums.entries()) {
                            const newSum = sum + num;
                            if (!possibleSums.has(newSum)) {
                                newEntries.set(newSum, [...path, num]);
                            }
                        }

                        for (const [sum, path] of newEntries.entries()) {
                            possibleSums.set(sum, path);
                        }
                    }

                    const result = possibleSums.get(scaledTarget);
                    if (!result) return null;

                    // Convert back to float
                    return result.map(n => n / scale);
                }

                const result = findSubsetThatSumsToTarget(numbers, target);
                const endTime = performance.now();
                const actualTime = (endTime - startTime) / 1000;

                // Hide loading state
                loadingElement.classList.add("hidden");

                if (result) {
                    subsetDisplay.innerHTML = `Valid Subset: ${result.join(" + ")} = ${target}<br><span class="text-sm text-gray-500">(Computed in ${actualTime.toFixed(2)} seconds)</span>`;
                } else {
                    subsetDisplay.textContent = "No subset found that sums to the target.";
                }
            }, 100);
        }

        function calculateOriginalAmount() {
            const totalAmount = parseFloat(document.getElementById("totalAmount").value);
            const tipPercentage = parseFloat(document.getElementById("tipPercentage").value);
            const taxPercentage = parseFloat(document.getElementById("taxPercentage").value);
            const originalAmountDisplay = document.getElementById("originalAmount");

            if (isNaN(totalAmount) || isNaN(tipPercentage) || isNaN(taxPercentage)) {
                originalAmountDisplay.textContent = "Please enter valid numbers for all fields.";
                return;
            }

            if (totalAmount <= 0 || tipPercentage < 0 || taxPercentage < 0) {
                originalAmountDisplay.textContent = "Please enter positive numbers.";
                return;
            }

            const originalAmount = totalAmount / (1 + tipPercentage / 100 + taxPercentage / 100);
            originalAmountDisplay.textContent = originalAmount.toFixed(2);
        }
    </script>
</body>
</html>
